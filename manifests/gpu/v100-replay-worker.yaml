# V100 fault-replay worker — batch-train pool.
#
# Replays fault-injection experiments (scripts/) against a target workload to
# generate labeled fault traffic for the corpus, and mines routine operational
# spikes as HARD NEGATIVES (so the trainer sees real benign-but-spiky cases, not
# only synthetic faults). The detector archives the resulting feature windows;
# harvest them into /data/features/windows.jsonl for the weak-label worker.
#
#   kubectl apply -f manifests/gpu/v100-replay-worker.yaml
#   kubectl -n ebpf-final logs -f job/v100-replay-worker
apiVersion: batch/v1
kind: Job
metadata:
  name: v100-replay-worker
  namespace: ebpf-final
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-cred
      nodeSelector:
        gpu-role: batch-train
        gpu-model: v100
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: replay
          image: ghcr.io/mlnyuk/ebpf-final-detector:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Replay scenarios live in the image under scripts/. Each writes
              # labeled fault windows; source_file names map to fault_type via
              # src/triage/case_bundle.py:FILENAME_FAULT_HINTS. Coverage:
              #   cpu_stress              -> cpu_pressure
              #   mem_stress              -> memory_pressure
              #   network_delay/packet_loss -> tcp_retrans
              #   disk_io_stress          -> disk_io_latency
              #   pvc_io_stress           -> pvc_io_latency
              #   controlplane_pressure   -> controlplane_pressure
              #   gpu_mem_stress          -> gpu_pressure
              #   normal_workload         -> normal (HARD NEGATIVE)
              echo "replay scenarios: ${FAULTS}"
              for f in ${FAULTS}; do
                echo "[replay] $f (${DURATION:-60}s)"
                sh "scripts/${f}.sh" "${DURATION:-60}" || true
              done
              # Hard-negative mining is also data-driven: routine spikes (cron,
              # image pulls, jupyter startup) are labeled 'normal' by the weak
              # labeler's HARD_NEGATIVE_HINTS — normal_workload.sh seeds extra ones.
          env:
            - name: FAULTS
              value: "cpu_stress mem_stress network_delay packet_loss disk_io_stress pvc_io_stress controlplane_pressure gpu_mem_stress normal_workload"
            - name: DURATION
              value: "60"
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "4", memory: 4Gi}
