# Distill-automation CronJob. Nightly (while Qwen is up), re-distill the runtime
# noise filter from the live anomaly stream and hot-swap it into the detectors
# via /noise-live + /reload, behind a false-suppress promotion gate. Self-skips
# when Qwen is offline. See scripts/distill_pipeline.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebpf-distill
  namespace: ebpf-final
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ebpf-distill
  namespace: ebpf-final
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ebpf-distill
  namespace: ebpf-final
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ebpf-distill
subjects:
  - kind: ServiceAccount
    name: ebpf-distill
    namespace: ebpf-final
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ebpf-distill
  namespace: ebpf-final
spec:
  # 02:00 UTC = 11:00 KST. Off-schedule the LLM is down and the job self-skips.
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: ebpf-distill
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-cred
          containers:
            - name: distill
              image: ghcr.io/mlnyuk/ebpf-final-distill:latest
              imagePullPolicy: Always
              env:
                - name: NAMESPACE
                  value: ebpf-final
                - name: QWEN_BASE
                  value: http://qwen3-32b-5090.default:8000
                - name: QWEN_MODEL
                  value: qwen3-32b
                # Two-model agreement: set when the 14B serve app is up.
                # Leave QWEN2_BASE empty to label with 32B only (graceful).
                - name: QWEN2_BASE
                  value: ""
                - name: QWEN2_MODEL
                  value: qwen2.5-14b
                - name: TELEGRAM_CHAT_ID
                  value: "8098454352"
                - name: FALSE_SUPPRESS_FLOOR
                  value: "0.01"
                - name: NOISE_FILTER_THRESHOLD
                  value: "0.99"
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: telegram
                  mountPath: /secrets/telegram
                  readOnly: true
              resources:
                requests: {cpu: "250m", memory: 512Mi}
                limits: {cpu: "2", memory: 2Gi}
          volumes:
            - name: work
              emptyDir: {}
            - name: telegram
              secret:
                secretName: alertmanager-telegram
                items:
                  - {key: token, path: token}
