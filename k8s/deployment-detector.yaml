# Detector / API Deployment. Stateless; scale via replicas.
# Ships the trained model baked into the image (models/isolation_forest.pkl).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebpf-detector
  namespace: ebpf-final
  labels:
    app: ebpf-detector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ebpf-detector
  template:
    metadata:
      labels:
        app: ebpf-detector
    spec:
      serviceAccountName: ebpf-detector
      imagePullSecrets:
        - name: ghcr-cred
      # Spread replicas across nodes so a single node loss never takes the
      # whole detector down (preferred: still schedules if nodes are scarce).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ebpf-detector
                topologyKey: kubernetes.io/hostname
      containers:
        - name: detector
          image: ghcr.io/mlnyuk/ebpf-final-detector:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODEL_PATH
              value: /app/models/isolation_forest.pkl
            - name: ARCHIVE_DIR
              value: /archive
            - name: LIVE_MODEL_PATH
              value: /models-live/isolation_forest.pkl
            # Distilled noise filter (post-IF suppression of benign daemon noise).
            # Artifacts baked into the image at models/; tune or disable here.
            - name: NOISE_FILTER_ENABLED
              value: "true"
            - name: NOISE_FILTER_THRESHOLD
              value: "0.99"
            # Promoted (re-distilled) filter artifacts land here; win over baked.
            - name: NOISE_FILTER_LIVE_DIR
              value: /noise-live
          volumeMounts:
            - name: config
              mountPath: /app/configs
            - name: archive
              mountPath: /archive
            - name: live-model
              mountPath: /models-live
            - name: noise-live
              mountPath: /noise-live
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              # request sized so HPA CPU-utilization (% of request) is meaningful;
              # load test showed mem peaks ~180Mi, so 1Gi limit was overkill.
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: ebpf-final-config
        # Node-local archive. RWX (longhorn share-manager) is not functional on
        # this cluster, so we use hostPath instead of a ReadWriteMany PVC. Each
        # replica writes a per-pod daily file (archive.py keys on HOSTNAME), so
        # the two HA replicas on different nodes keep separate files — harvest
        # from the detector nodes for the retraining corpus.
        - name: archive
          hostPath:
            path: /var/lib/ebpf-detector-archive
            type: DirectoryOrCreate
        # Promoted (retrained) model, written by the retrain pipeline and loaded
        # via /reload. hostPath so it survives restarts on that node.
        - name: live-model
          hostPath:
            path: /var/lib/ebpf-detector-model
            type: DirectoryOrCreate
        # Re-distilled noise filter (noise_filter.pkl + noise_baseline.json),
        # written by the distill pipeline and loaded via /reload.
        - name: noise-live
          hostPath:
            path: /var/lib/ebpf-detector-noise
            type: DirectoryOrCreate
---
# Keep at least one detector serving during voluntary disruptions
# (node drain, rolling update, autoscaler eviction).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ebpf-detector
  namespace: ebpf-final
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ebpf-detector
