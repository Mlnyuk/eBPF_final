# Detector / API Deployment. Stateless; scale via replicas.
# Ships the trained model baked into the image (models/isolation_forest.pkl).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebpf-detector
  namespace: ebpf-final
  labels:
    app: ebpf-detector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ebpf-detector
  template:
    metadata:
      labels:
        app: ebpf-detector
    spec:
      serviceAccountName: ebpf-detector
      imagePullSecrets:
        - name: ghcr-cred
      # Spread replicas across nodes so a single node loss never takes the
      # whole detector down (preferred: still schedules if nodes are scarce).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ebpf-detector
                topologyKey: kubernetes.io/hostname
      containers:
        - name: detector
          image: ghcr.io/mlnyuk/ebpf-final-detector:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODEL_PATH
              value: /app/models/isolation_forest.pkl
          volumeMounts:
            - name: config
              mountPath: /app/configs
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: ebpf-final-config
---
# Keep at least one detector serving during voluntary disruptions
# (node drain, rolling update, autoscaler eviction).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ebpf-detector
  namespace: ebpf-final
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ebpf-detector
