# eBPF collector DaemonSet — one pod per node.
#
# Privileges: BCC compiles + loads BPF and attaches kprobes/tracepoints, which
# requires CAP_BPF + CAP_SYS_ADMIN (and perf). We run privileged for MVP
# simplicity; tighten to explicit capabilities for production.
#
# Host mounts:
#   /sys              - BPF, tracefs, cgroupfs (cgroup->pod mapping)
#   /lib/modules      - kernel modules (BCC)
#   /usr/src          - kernel headers (BCC compiles against running kernel)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-collector
  namespace: ebpf-final
  labels:
    app: ebpf-collector
spec:
  selector:
    matchLabels:
      app: ebpf-collector
  template:
    metadata:
      labels:
        app: ebpf-collector
    spec:
      serviceAccountName: ebpf-collector
      hostPID: true            # see all host processes/cgroups
      imagePullSecrets:
        - name: ghcr-cred
      # Exclude control-plane nodes: disk-constrained (DiskPressure eviction loop).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      containers:
        - name: collector
          image: ghcr.io/mlnyuk/ebpf-final-collector:latest
          imagePullPolicy: Always
          args: ["--window", "10", "--out", "/data", "--format", "both",
                 "--push-url", "http://ebpf-detector.ebpf-final:8080"]
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ENABLE_K8S_MAPPING
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /app/configs
            - name: sys
              mountPath: /sys
              readOnly: false
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: kernel-src
              mountPath: /usr/src
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
      volumes:
        - name: config
          configMap:
            name: ebpf-final-config
        - name: sys
          hostPath: {path: /sys}
        - name: modules
          hostPath: {path: /lib/modules}
        - name: kernel-src
          hostPath: {path: /usr/src}
        - name: data
          emptyDir: {}
