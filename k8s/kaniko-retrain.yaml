# In-cluster build of the retrain-automation image (Dockerfile.retrain).
#   kubectl apply -f k8s/kaniko-retrain.yaml
#   kubectl -n ebpf-final logs -f job/kaniko-retrain
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-retrain
  namespace: ebpf-final
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - "--context=git://github.com/Mlnyuk/eBPF_final.git#refs/heads/main"
            - "--dockerfile=docker/Dockerfile.retrain"
            - "--destination=ghcr.io/mlnyuk/ebpf-final-retrain:latest"
            - "--cache=true"
          volumeMounts:
            - {name: docker-config, mountPath: /kaniko/.docker}
      volumes:
        - name: docker-config
          secret:
            secretName: ghcr-cred
            items:
              - {key: .dockerconfigjson, path: config.json}
