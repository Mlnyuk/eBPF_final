# Fault injection pods for anomaly detection validation (v2 — stronger, continuous).
#
# v1 weakness: bash loops finished in seconds (fork/syscall barely covered 1 window),
# and curl→/health succeeded so no TCP retransmit. v2 uses stress-ng / fio to drive
# each feature dimension HARD for a continuous 300s, guaranteeing many fault windows.
#
# Each pod pins to a distinct node so its cgroup is isolated and labelable.
#   worker-1 cpu | worker-2 fork | worker-3 disk | infra-1 network | infra-2 syscall
#
# Usage:
#   kubectl apply -f k8s/fault-injections.yaml          # all five
#   kubectl apply -f k8s/fault-injections.yaml -l fault=cpu-stress   # one
#   kubectl delete -f k8s/fault-injections.yaml
---
# 1. CPU stress — context_switch_count, cpu-bound scheduling
apiVersion: v1
kind: Pod
metadata:
  name: fault-cpu-stress
  namespace: ebpf-final
  labels: {app: fault-injection, fault: cpu-stress}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-1}
  restartPolicy: Never
  containers:
    - name: stressor
      image: ubuntu:24.04
      command: ["/bin/bash", "-c"]
      args:
        - "apt-get update -qq && apt-get install -y -qq stress-ng &&
           stress-ng --cpu 4 --cpu-method matrixprod --timeout 300s --metrics-brief"
      resources:
        requests: {cpu: 200m, memory: 256Mi}
        limits:   {cpu: "4",  memory: 512Mi}
---
# 2. Fork/exec storm — process_fork_count, process_exec_count, context_switch_count
apiVersion: v1
kind: Pod
metadata:
  name: fault-fork-bomb
  namespace: ebpf-final
  labels: {app: fault-injection, fault: fork-bomb}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-2}
  restartPolicy: Never
  containers:
    - name: forker
      image: ubuntu:24.04
      command: ["/bin/bash", "-c"]
      # --fork: continuously fork+exit; --exec: spawn processes via execve
      args:
        - "apt-get update -qq && apt-get install -y -qq stress-ng &&
           stress-ng --fork 16 --exec 4 --timeout 300s --metrics-brief"
      resources:
        requests: {cpu: 200m, memory: 128Mi}
        limits:   {cpu: "2",  memory: 384Mi}
---
# 3. Disk I/O stress — disk_read_bytes, disk_write_bytes, disk_io_latency_ms
apiVersion: v1
kind: Pod
metadata:
  name: fault-disk-stress
  namespace: ebpf-final
  labels: {app: fault-injection, fault: disk-stress}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-3}
  restartPolicy: Never
  containers:
    - name: disk-io
      image: ubuntu:24.04
      command: ["/bin/bash", "-c"]
      args:
        - "apt-get update -qq && apt-get install -y -qq fio &&
           fio --name=randrw --rw=randrw --bs=4k --size=256m
               --numjobs=4 --iodepth=32 --runtime=300 --time_based
               --directory=/tmp --output-format=terse"
      resources:
        requests: {cpu: 100m, memory: 64Mi, ephemeral-storage: 2Gi}
        limits:   {cpu: "2",  memory: 256Mi, ephemeral-storage: 2Gi}
---
# 4. Network flood — tcp_connect_rate, network_tx/rx_bytes, tcp_retransmit_rate
apiVersion: v1
kind: Pod
metadata:
  name: fault-network-flood
  namespace: ebpf-final
  labels: {app: fault-injection, fault: network-flood}
spec:
  nodeSelector: {kubernetes.io/hostname: infra-1}
  restartPolicy: Never
  containers:
    - name: flooder
      image: ubuntu:24.04
      command: ["/bin/bash", "-c"]
      # --sock: many TCP socket connect/send/recv cycles (drives connect_rate +
      # tx/rx bytes); --udp: datagram flood. Both push real kernel net counters.
      args:
        - "apt-get update -qq && apt-get install -y -qq stress-ng &&
           stress-ng --sock 12 --sockfd 4 --udp 6 --timeout 300s --metrics-brief"
      resources:
        requests: {cpu: 200m, memory: 128Mi}
        limits:   {cpu: "2",  memory: 384Mi}
---
# 5. Syscall flood — syscall_read_rate, syscall_write_rate, syscall_open_rate
apiVersion: v1
kind: Pod
metadata:
  name: fault-syscall-flood
  namespace: ebpf-final
  labels: {app: fault-injection, fault: syscall-flood}
spec:
  nodeSelector: {kubernetes.io/hostname: infra-2}
  restartPolicy: Never
  containers:
    - name: syscaller
      image: ubuntu:24.04
      command: ["/bin/bash", "-c"]
      # Time-bounded bash loop hammering open/write/read syscalls. stress-ng kept
      # OOMing this node (--pipe/--iomix ballooned past 512Mi); a plain loop uses
      # near-zero memory and, unlike v1's fixed-iteration loop, runs a full 300s
      # so it spans many detector windows. No apt install needed.
      args:
        - |
          mkdir -p /tmp/f
          end=$(( $(date +%s) + 300 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            i=0
            while [ $i -lt 500 ]; do
              f=/tmp/f/$((i % 50))
              echo x > "$f"          # open+write
              cat "$f" > /dev/null   # open+read
              i=$((i + 1))
            done
          done
      resources:
        requests: {cpu: 200m, memory: 64Mi}
        limits:   {cpu: "2",  memory: 256Mi}
