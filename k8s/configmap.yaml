# Runtime config mounted into both collector and detector at /app/configs/config.yaml.
# Mirrors configs/config.yaml in the repo. Edit + `kubectl apply` to reconfigure.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ebpf-final-config
  namespace: ebpf-final
data:
  config.yaml: |
    window:
      seconds: 10
    features:
      - syscall_read_rate
      - syscall_write_rate
      - syscall_open_rate
      - tcp_connect_rate
      - tcp_retransmit_rate
      - network_rx_bytes
      - network_tx_bytes
      - disk_read_bytes
      - disk_write_bytes
      - disk_io_latency_ms
      - process_exec_count
      - process_fork_count
      - context_switch_count
    metadata_columns:
      - timestamp
      - node
      - namespace
      - pod
      - container
    model:
      path: models/isolation_forest.pkl
      contamination: 0.02
      n_estimators: 200
      max_samples: auto
      random_state: 42
    detector:
      score_threshold: null
      host: 0.0.0.0
      port: 8080
    collector:
      node_name_env: NODE_NAME
      output_dir: /data
      output_format: both
      enable_k8s_mapping: true
