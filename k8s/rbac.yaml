# ServiceAccounts + RBAC.
# The collector reads Pod metadata (for cgroup->pod mapping). The detector
# needs no cluster API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebpf-collector
  namespace: ebpf-final
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebpf-detector
  namespace: ebpf-final
---
# Collector needs read access to pods cluster-wide to resolve cgroup -> pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ebpf-collector-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ebpf-collector-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ebpf-collector-reader
subjects:
  - kind: ServiceAccount
    name: ebpf-collector
    namespace: ebpf-final
